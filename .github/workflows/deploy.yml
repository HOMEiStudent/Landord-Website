name: Deploy to GitHub Pages

on:
  push:
    branches:
      - Main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages if the API reports it as not configured, so a transient
          # "Get Pages site failed: Not Found" no longer breaks the deploy.
          enablement: true

      # Publish only the public site. Internal files (reports, task logs,
      # audits, draft content, the old Java prototype and its keystore) stay
      # in the repository but are no longer served on the live domain.
      - name: Stage public files
        run: |
          mkdir -p _site
          cp index.html privacy.html renters-rights-act.html \
             savings-calculator.html how-the-calculator-works.html \
             join.html about.html \
             favicon.ico robots.txt sitemap.xml CNAME _site/
          cp -r blog css js images scripts assets _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
